[package]
name = "selene-gql-fuzz"
version = "1.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
selene-gql = { path = "..", version = "1.0.0" }

[[bin]]
name = "parse_gql"
path = "fuzz_targets/parse_gql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false
