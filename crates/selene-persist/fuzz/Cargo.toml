[package]
name = "selene-db-persist-fuzz"
version = "1.2.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
selene-persist = { package = "selene-db-persist", path = "..", version = "1.2.0" }

[[bin]]
name = "decode_manifest"
path = "fuzz_targets/decode_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_wal"
path = "fuzz_targets/decode_wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_audit"
path = "fuzz_targets/decode_audit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_snapshot"
path = "fuzz_targets/decode_snapshot.rs"
test = false
doc = false
bench = false
