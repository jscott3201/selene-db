[package]
name = "selene-db-persist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WAL and snapshot persistence formats for selene-db."
autobenches = false

[lib]
name = "selene_persist"

[dependencies]
selene-core = { package = "selene-db-core", path = "../selene-core", version = "1.4.0" }
thiserror.workspace = true
miette.workspace = true
serde.workspace = true
postcard = { workspace = true, features = ["use-std"] }
blake3.workspace = true
xxhash-rust.workspace = true
zstd.workspace = true
tracing.workspace = true
rayon.workspace = true

[features]
metrics = ["selene-core/metrics"]

[dev-dependencies]
criterion.workspace = true
mimalloc.workspace = true
proptest.workspace = true
rstest.workspace = true
rust_decimal.workspace = true
selene-testing = { package = "selene-db-testing", path = "../selene-testing" }
serde_json.workspace = true
uuid.workspace = true

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
