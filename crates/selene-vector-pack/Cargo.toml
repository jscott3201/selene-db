[package]
name = "selene-vector-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Procedure-pack adapters for selene vector indexes"
autobenches = false

[features]
test-harness = ["selene-gql/test-harness"]

[dependencies]
fastrand.workspace = true
roaring.workspace = true
selene-core = { path = "../selene-core", version = "0.0.0" }
selene-gql = { path = "../selene-gql", version = "0.0.0" }
selene-graph = { path = "../selene-graph", version = "0.0.0" }
selene-pack = { path = "../selene-pack", version = "0.0.0" }
selene-vector = { path = "../selene-vector", version = "0.0.0" }

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
selene-gql = { path = "../selene-gql", version = "0.0.0", features = ["test-harness"] }
mimalloc.workspace = true
selene-testing = { path = "../selene-testing", version = "0.0.0", features = ["vector"] }

[[test]]
name = "search"
required-features = ["test-harness"]

[[test]]
name = "bulk"
required-features = ["test-harness"]

[[test]]
name = "ivf_read"
required-features = ["test-harness"]

[[test]]
name = "vector_pack_snapshot_corpus"
required-features = ["test-harness"]

[[bench]]
name = "vector_pack"
harness = false

[lints]
workspace = true
