[package]
name = "selene-db-algorithms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Graph algorithms for selene-db (projection, structural, pathfinding, centrality, community)"

[lib]
name = "selene_algorithms"

[dependencies]
selene-core = { package = "selene-db-core", path = "../selene-core", version = "1.3.0" }
selene-graph = { package = "selene-db-graph", path = "../selene-graph", version = "1.3.0" }
parking_lot.workspace = true
rayon.workspace = true
roaring.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
mimalloc.workspace = true
proptest.workspace = true
selene-testing = { package = "selene-db-testing", path = "../selene-testing" }

[features]
test-harness = []

[[test]]
name = "algo_snapshot_corpus"
required-features = ["test-harness"]

[[bench]]
name = "algo_bench"
harness = false

[[bench]]
name = "projection"
harness = false

[[bench]]
name = "vector_graph_retrieval"
harness = false

[lints]
workspace = true
