[package]
name = "selene-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HNSW vector index extension for selene-db."
autobenches = false

[features]
default = []
simd-simsimd = ["dep:simsimd"]
test-harness = ["dep:blake3"]

[dependencies]
selene-core = { path = "../selene-core", version = "0.0.0" }
selene-graph = { path = "../selene-graph", version = "0.0.0" }
arc-swap.workspace = true
blake3 = { workspace = true, optional = true }
fastrand.workspace = true
parking_lot.workspace = true
rkyv.workspace = true
roaring.workspace = true
smallvec.workspace = true
thiserror.workspace = true
miette.workspace = true
simsimd = { version = "5", optional = true }

[dev-dependencies]
selene-pack = { path = "../selene-pack", version = "0.0.0" }
selene-testing = { path = "../selene-testing", version = "0.0.0", features = ["vector"] }
blake3.workspace = true
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[test]]
name = "vector_snapshot_corpus"
required-features = ["test-harness"]

[[bench]]
name = "recall"
harness = false

[[bench]]
name = "quant_recall"
harness = false

[lints]
workspace = true
