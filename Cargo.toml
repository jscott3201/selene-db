# selene-db workspace root.
#
# Multi-crate, no umbrella facade (decision D8 in CLAUDE.md). Members are
# added as they're built.
#
# Workspace-level configuration (lints, profile, deps version pins) lives
# here so each member crate inherits the floor without re-declaring.

[workspace]
resolver = "3"
members = [
    "crates/selene-core",
    "crates/selene-graph",
    "crates/selene-persist",
    "crates/selene-gql",
    "crates/selene-pack",
    "crates/selene-algorithms",
    "crates/selene-algorithms-pack",
    "crates/selene-vector-pack",
    "crates/selene-testing",
    "crates/selene-vector",
]
exclude = ["_spec", "crates/selene-gql/fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["selene-db contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jscott3201/selene-db"
homepage = "https://github.com/jscott3201/selene-db"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"

# Workspace-level dependency versions go here as crates are added. Keeping
# them centralized means a single line bumps the version everywhere.
[workspace.dependencies]
thiserror = "2.0"
miette = { version = "7.6", features = ["derive"] }
pest = "2.8"
pest_derive = "2.8"
lasso = { version = "0.7", features = ["multi-threaded"] }
jiff = { version = "0.2", features = ["serde"] }
rust_decimal = { version = "1.42", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
smallvec = { version = "1", features = ["const_generics", "serde", "union"] }
bytes = "1.10"
serde = { version = "1.0", features = ["derive", "rc"] }
# pointer_width_64 pins archived relative-pointer width to 64 bits; v1.0
# ships only x86_64 / aarch64 targets, so this is intentional. unaligned
# lets rkyv decode archives from byte buffers (Vec<u8>) without requiring
# 8-byte alignment; section bytes come back from the snapshot reader as
# plain Vec<u8> with only 1-byte alignment guarantees by type.
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "pointer_width_64", "unaligned"] }
arc-swap = "1"
fastrand = "2"
parking_lot = "0.12"
rayon = "1"
imbl = { version = "7.0", default-features = false }
rustc-hash = "2.1"
roaring = "0.11"
triomphe = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
lru = "0.16"
blake3 = "1.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
papaya = "0.2"
schemars = "1.2"
jsonschema = { version = "0.46", default-features = false }
semver = "1"
serde_json = "1"
# Runtime stack-growth shim. Used by the GQL analyzer to bound recursive
# `bind_value_expr` against the OS default thread stack (2 MB on macOS);
# matches the rustc / syn / serde recursion pattern.
stacker = "0.1"
selene-persist = { path = "crates/selene-persist", version = "1.0.0" }

# Dev dependencies.
criterion = "0.8"
iai-callgrind = "0.16"
# Bench-binary global allocator. Library crates do NOT depend on this;
# embedders pick their own allocator.
mimalloc = { version = "0.1", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rstest = "0.26"
insta = "1.47"
postcard = { version = "1.1", features = ["alloc"] }
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
