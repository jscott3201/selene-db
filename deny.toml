# cargo-deny baseline for selene-db.
#
# Schema version 2 (post-PR-611). Anything not in [licenses].allow is denied;
# explicit `unlicensed` / `copyleft` / `default` keys are removed.
#
# Enforces:
#   - rustls-only TLS posture (no native-tls, no openssl-sys, no openssl-src)
#   - dual MIT OR Apache-2.0 licensing posture for the workspace; permissive
#     license allow-list for transitive deps; MPL-2.0 explicitly allowed for
#     `imbl` (decision D7 in CLAUDE.md — file-level copyleft, not infectious
#     to selene-db's MIT/Apache license posture)
#   - crates.io as the only source for non-workspace deps; git deps must be
#     pinned to a sha

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []
# Documented advisory ignores must carry reason + owner.
# Example:
# ignore = [
#   { id = "RUSTSEC-XXXX-YYYY", reason = "...", owner = "..." },
# ]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  # MIT-0: no-attribution MIT variant. Pulled by jsonschema's URI resolver
  # stack through borrow-or-share; OSI approved and permissive.
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  # MPL-2.0: file-level copyleft (NOT infectious to dependents). Allowed
  # explicitly for imbl, the only mature complete persistent-collection
  # library in the Rust ecosystem (decision D7). Selene-db itself remains
  # dual MIT/Apache-2.0; only imbl's own files carry MPL-2.0 terms in any
  # downstream redistribution.
  "MPL-2.0",
]
exceptions = []

[bans]
# Keep a single coherent semver line for each selene crate in dependency trees.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
  # rustls-only TLS posture
  { name = "native-tls" },
  { name = "openssl-sys" },
  { name = "openssl-src" },
  { name = "openssl" },
  { name = "openssl-probe" },
  # rustls is the chosen TLS lib; reject schannel and security-framework
  # so we don't accidentally pull a platform-specific TLS shim.
  { name = "schannel" },
  { name = "security-framework" },
]
skip = [
  # BRIEF-05: getrandom 0.3 (proptest/rand) and 0.4 (uuid/insta) carry
  # target-specific WASI helpers that currently resolve to two wit-bindgen lines.
  { name = "wit-bindgen", version = "0.51.0" },
  # BRIEF-07: imbl 7.0's persistent HashMap pulls rand_core/getrandom 0.3
  # for its internal randomized state, while uuid/tempfile currently pull
  # getrandom 0.4. Both are live maintained lines; allow the older line until
  # the upstream ecosystem converges.
  { name = "getrandom", version = "0.3.4" },
  # Same getrandom 0.3/0.4 split through WASI support crates.
  { name = "r-efi", version = "5.3.0" },
  # BRIEF-14: rkyv 0.8's alloc support pulls hashbrown 0.17 for snapshot
  # archives while lasso 0.7/dashmap remain on hashbrown 0.14. Both are live
  # maintained lines; allow the older lasso line until upstream converges.
  { name = "hashbrown", version = "0.14.5" },
  # BRIEF-43: jsonschema 0.46 pulls referencing 0.46, which remains on
  # hashbrown 0.16 while rkyv/proc-macro tooling have moved to 0.17. Both
  # lines are maintained; allow the resolver line until upstream converges.
  { name = "hashbrown", version = "0.16.1" },
  # BRIEF-16: pest_derive 2.8 builds through sha2/cpufeatures 0.2 while
  # blake3 1.8 uses cpufeatures 0.3. Both lines are maintained and target-gated;
  # keep the older build-time line until upstream converges.
  { name = "cpufeatures", version = "0.2.17" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
