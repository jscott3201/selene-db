name: manual bench

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile envelope.
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
          - stress
      layer:
        description: Benchmark layer to run.
        required: true
        default: criterion
        type: choice
        options:
          - criterion
          - iai
          - both

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  bench:
    name: manual ${{ inputs.layer }} / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install valgrind for iai-callgrind
        if: inputs.layer != 'criterion'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: run benchmarks
        run: scripts/run-benches.sh --profile "${{ inputs.profile }}" --layer "${{ inputs.layer }}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.layer != 'iai'
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: ignore
