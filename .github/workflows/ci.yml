# Fast iteration CI for selene-db — runs on PRs into `development`.
#
# Workflow model (2026-05-28): Brief → PR → `development`; releases merge
# `development` → `main`, where the full suite runs (see release.yml).
# This gate is deliberately CHEAP — no Rust compilation — so Brief PRs iterate
# fast and stay cost-light. The heavy gates moved to:
#   - local hooks (`.githooks/pre-push`: clippy + nextest) — run `scripts/install-hooks.sh`
#   - release.yml (PR → main): the comprehensive pre-release gate (clippy + tests
#     + doctests + fuzz + macOS + cargo-audit)
#   - nightly.yml (schedule + push:main): advisory-drift + fuzz soak
#
# Kept here (all near-instant — no toolchain build except a fast rustfmt pass):
#   - cargo fmt --all --check
#   - file-size cap (700 LOC), no-secret scan, bench-invocation lint
#   - cargo-deny + THIRDPARTY.md currency  (deps-changed only)
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/concurrency:/with:).

name: ci

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  # Dep-validation jobs (cargo-deny, third-party attribution) gate on
  # `outputs.deps` so they only run when dependency manifests changed.
  changes:
    name: detect changes
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'crates/*/fuzz/Cargo.toml'
              - 'deny.toml'
              - 'about.hbs'
              - 'about.toml'

  fmt:
    name: fmt
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  file-size-cap:
    name: file-size cap (700 LOC)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-secrets.sh

  rowid-arith-gate:
    name: id<->row arithmetic gate (BRIEF-Item-4a / D22)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-rowid-arith.sh

  version-locked-feature-error-gate:
    name: version-locked feature-error gate (CONFORMANCE-00 / CW-3)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-version-locked-feature-error.sh

  bench-invocation-lint:
    name: bench invocation lint
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-bench-invocation.sh .
      - run: bash .github/scripts/check-bench-invocation.test.sh
      - run: bash .github/scripts/check-mimalloc-dev-dep.sh .
      - run: bash .github/scripts/check-mimalloc-dev-dep.test.sh
      - run: bash scripts/run-benches.test.sh

  deny:
    name: cargo-deny
    needs: changes
    # Skip when no dependency manifests changed (the common case for source-only PRs).
    if: |
      (github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  thirdparty-current:
    name: third-party attribution current
    needs: changes
    # THIRDPARTY.md only drifts when Cargo.lock changes (cargo-about is deterministic).
    if: |
      (github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: bash .github/scripts/check-thirdparty-current.sh
