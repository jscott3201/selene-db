# Baseline CI for selene-db.
#
# Implements the gates from CLAUDE.md hard rules:
#   - cargo fmt --all --check
#   - cargo clippy --all-targets -- -D warnings (pedantic + nursery via
#     workspace [lints] section, NOT command line)
#   - cargo test --workspace
#   - cargo deny check bans licenses sources
#   - cargo audit
#   - file-size cap (700 LOC) via check-file-size.sh
#   - basic no-secret scan via check-no-secrets.sh
#   - THIRDPARTY.md current via check-thirdparty-current.sh
#
# Security notes:
#   - No `${{ github.event.* }}` interpolations appear in any `run:` command;
#     all such expansions are confined to `if:` conditions, `concurrency:`
#     keys, and `with:` action inputs. No shell-injection surface.

name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt or tracked-source rustfmt
        run: |
          if cargo metadata --format-version=1 --no-deps | grep -q '"packages":\[\]'; then
            rustfmt --check $(git ls-files '*.rs')
          else
            cargo fmt --all --check
          fi

  clippy:
    name: clippy (${{ matrix.os }})
    # Matrix runs on both Linux (CI host) and macOS (dev host) since we ship to both
    # per project_post_m5f_priorities. matrix.os values are workflow-defined constants
    # (not user input), so no command-injection surface here.
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: |
          if cargo metadata --format-version=1 --no-deps | grep -q '"packages":\[\]'; then
            echo "No workspace packages yet; clippy starts once crate manifests land."
          else
            cargo clippy --workspace --all-targets --locked -- -D warnings
          fi

  test:
    name: test (${{ matrix.os }})
    # Linux + macOS matrix per project_post_m5f_priorities (Windows is out of scope).
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Drop debuginfo from the `cargo test` build graph. The whole graph
      # (workspace + deps) builds under the `test` profile, so this strips
      # the DWARF bulk from every rlib/test binary, keeping the linker's
      # disk/mmap footprint under the runner cap (ubuntu `ld` SIGBUS).
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          if cargo metadata --format-version=1 --no-deps | grep -q '"packages":\[\]'; then
            echo "No workspace packages yet; tests start once crate manifests land."
          else
            cargo test --workspace --locked --all-features
          fi

  parse-fuzz:
    name: parse-fuzz
    # Linux-only: cargo-fuzz/libFuzzer requires a Linux target triple.
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: crates/selene-gql/fuzz/corpus
          key: gql-fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gql-fuzz-corpus-${{ runner.os }}-
      - name: seed parse corpus
        run: |
          mkdir -p crates/selene-gql/fuzz/corpus/parse_gql
          find crates/selene-testing/corpus/positive -name '*.gql' -exec cp {} crates/selene-gql/fuzz/corpus/parse_gql/ \;
      - name: fuzz parser
        working-directory: crates/selene-gql/fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse_gql -- -max_total_time=60

  deny:
    name: cargo-deny
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cargo-lock
        run: |
          if [ -f Cargo.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cargo-lock.outputs.exists == 'false'
        run: echo "No Cargo.lock yet; cargo-deny starts once dependencies land."
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          command: check bans licenses sources

  audit:
    name: cargo-audit
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cargo-lock
        run: |
          if [ -f Cargo.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cargo-lock.outputs.exists == 'false'
        run: echo "No Cargo.lock yet; cargo-audit starts once dependencies land."
      - uses: taiki-e/install-action@v2
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          tool: cargo-audit
      - uses: actions/cache@v4
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: advisory-db-${{ runner.os }}-
      - if: steps.cargo-lock.outputs.exists == 'true'
        run: cargo audit --color always

  file-size-cap:
    name: file-size cap (700 LOC)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-secrets.sh

  bench-invocation-lint:
    name: bench invocation lint
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-bench-invocation.sh .
      - run: bash .github/scripts/check-bench-invocation.test.sh
      - run: bash .github/scripts/check-mimalloc-dev-dep.sh .
      - run: bash .github/scripts/check-mimalloc-dev-dep.test.sh
      - run: bash scripts/run-benches.test.sh

  thirdparty-current:
    name: third-party attribution current
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cargo-lock
        run: |
          if [ -f Cargo.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cargo-lock.outputs.exists == 'false'
        run: echo "No Cargo.lock yet; third-party attribution check starts once dependencies land."
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cargo-lock.outputs.exists == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.cargo-lock.outputs.exists == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          tool: cargo-about
      - if: steps.cargo-lock.outputs.exists == 'true'
        run: bash .github/scripts/check-thirdparty-current.sh
