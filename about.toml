# cargo-about configuration. Drives the generation of THIRDPARTY.md from
# Cargo.lock. Verified in CI by .github/scripts/check-thirdparty-current.sh.
#
# Permissive licenses we accept for transitive deps; mirrors deny.toml's
# [licenses].allow list (decision D7 added MPL-2.0 for imbl).

accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
]

# Crates that have unclear license metadata or require manual override
# go here with a justification.

# rkyv_derive ships its top-level MIT LICENSE alongside a second
# `src/serde/LICENSE` (a vendored copy of serde's MIT license, lacking
# the copyright header). Default cargo-about discovery is filesystem-
# order-dependent: macOS finds only the top-level file, Linux finds both,
# producing two different MIT clusters in THIRDPARTY.md. Pin discovery to
# the top-level LICENSE so the regenerated file is byte-deterministic
# across CI and contributor environments.
[rkyv_derive.clarify]
license = "MIT"

[[rkyv_derive.clarify.files]]
path = "LICENSE"
checksum = "635111a955495b5d8d34b8052f69656e8e45f6437f9266329077b9aad5fbe8d3"
license = "MIT"

# libmimalloc-sys ships the Rust wrapper MIT license at the crate root and
# the bundled C allocator MIT license under c_src. Default cargo-about
# discovery can choose differently across environments; pin the allocator
# license so THIRDPARTY.md is deterministic and names the Microsoft/Daan
# Leijen copyright carried by the code actually linked into bench binaries.
[libmimalloc-sys.clarify]
license = "MIT"

[[libmimalloc-sys.clarify.files]]
path = "c_src/mimalloc/v3/LICENSE"
checksum = "82ade5d7d9b029044b5fbbc326207fc47c2d44ee4dd71e8a559c36d728217de9"
license = "MIT"
